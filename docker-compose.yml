services:
  api:
    build:
      context: .
      args:
        APP_VERSION: dev
        BUILD_SHA: local
    image: sample-api:dev
    container_name: sample-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      APP_VERSION: dev
      BUILD_SHA: local
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
